name: Daily SEO Health Check

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run SEO verification
      run: |
        cd website
        python verify_p1.py > ../reports/seo-check-$(date +%Y%m%d).log 2>&1 || true
    
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: seo-report-${{ github.run_id }}
        path: reports/seo-check-*.log
        retention-days: 30
