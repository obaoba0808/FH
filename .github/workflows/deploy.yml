name: Verify OBAOBA.online deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify deployment
      run: |
        echo "GitHub Pages deployment is triggered automatically by the push to main."
        echo ""
        echo "IMPORTANT: obaoba.online is fronted by Cloudflare. Cloudflare serves a"
        echo "bot challenge (HTTP 403, fixed-length HTML body) to many cloud/datacenter"
        echo "IP ranges, which includes GitHub Actions runners. A plain 'must be 200'"
        echo "check is therefore unreliable from CI."
        echo ""
        echo "Decision policy:"
        echo "  200                -> asset served OK (proof the deployment is live)"
        echo "  403                -> Cloudflare bot challenge (NOT a deploy failure)"
        echo "  000/5xx after wait -> real failure"

        PASS=0
        FAIL=0

        check_url() {
          url="$1"
          last=""
          for attempt in $(seq 1 20); do
            code=$(curl -sS --max-time 20 -A "Mozilla/5.0 (compatible; OBAOBA-DeployCheck/1.0)" -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            last="$code"
            case "$code" in
              200)
                size=$(curl -sS --max-time 20 -A "Mozilla/5.0 (compatible; OBAOBA-DeployCheck/1.0)" -o /dev/null -w "%{size_download}" "$url" 2>/dev/null || echo "0")
                echo "OK   200  LEN=$size  $url  (attempt $attempt)"
                return 0
                ;;
              403)
                echo "challenge 403  $url  (Cloudflare bot challenge; accepting as reachable)"
                return 0
                ;;
              *)
                echo "wait $code  $url  (attempt $attempt)"
                sleep 15
                ;;
            esac
          done
          echo "::error::Deployment check failed for $url (last HTTP $last)"
          return 1
        }

        sleep 30

        for u in \
          "https://obaoba.online/" \
          "https://obaoba.online/dist/main.css?v=2" \
          "https://obaoba.online/site.webmanifest" ; do
          if check_url "$u"; then
            PASS=$((PASS+1))
          else
            FAIL=$((FAIL+1))
          fi
        done

        echo ""
        echo "Summary: PASS=$PASS  FAIL=$FAIL"
        if [ "$FAIL" != "0" ]; then
          echo "::error::Deployment verification failed ($FAIL URL(s) unreachable)."
          exit 1
        fi

        echo "All checks passed (reachable; 403 = Cloudflare challenge tolerated)."
        echo "Build status: https://github.com/obaoba0808/FH/actions"
