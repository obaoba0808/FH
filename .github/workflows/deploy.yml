name: Verify OBAOBA.online deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify deployment
      run: |
        echo "GitHub Pages deployment is triggered automatically by the push to main."
        echo "Waiting for Pages to rebuild..."
        sleep 60
        echo "--- checking live assets ---"
        for url in \
          "https://obaoba.online/" \
          "https://obaoba.online/dist/main.css?v=2" \
          "https://obaoba.online/site.webmanifest"
        do
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          size=$(curl -s -o /dev/null -w "%{size_download}" "$url")
          echo "$code  LEN=$size  $url"
          if [ "$code" != "200" ]; then
            echo "::error::Deployment check failed for $url (HTTP $code)"
            exit 1
          fi
        done
        echo "All checks passed."
        echo "Build status: https://github.com/obaoba0808/FH/actions"
